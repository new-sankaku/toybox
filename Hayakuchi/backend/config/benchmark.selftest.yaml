paths:
  phrases: data/phrases.json
  manifest: data/selftest/manifest.jsonl
  audio_root: data/selftest
  asset_root: data/selftest
  output_dir: results/selftest
  log_dir: logs

scoring:
  substitution_cost: 1.0
  deletion_cost: 1.0
  insertion_cost: 1.0

metrics:
  target_far: 0.05
  localization_tolerance: 1
  latency_percentiles:
    - 50
    - 95

report:
  include_samples: false

conditions:
  - id: clean
    label: 清音源
    ops: []
  - id: noise_snr10
    label: 環境Noise SNR10dB
    ops:
      - type: noise
        snr_db: 10.0
  - id: vc_pitch_up
    label: Voice Changer相当 +6半音
    ops:
      - type: pitch_shift
        semitones: 6.0

engines:
  - id: human_replay
    adapter: replay
    enabled: true
    params:
      transcripts: data/selftest/transcripts_human.json
