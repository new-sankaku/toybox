<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Hayakuchi Overlay</title>
<link rel="stylesheet" href="surface.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<svg class="sprite" aria-hidden="true"><defs>
  <symbol id="ico-flame" viewBox="0 0 24 24">
    <path d="M12 2c.6 3.4-1.2 4.9-2.8 6.3C7.4 9.9 6 11.3 6 14a6 6 0 0 0 12 0c0-2.2-.9-3.9-2-5.3-.5 1-1.2 1.7-2 2 .6-3.2-.9-6.6-2-8.7z"/>
  </symbol>
</defs></svg>

<div class="stage" id="stage" data-phase="ready">

  <header class="hud">
    <span class="level">
      <b class="level-tag" id="level-tag">Lv.1</b>
      <span class="level-bar"><i class="level-fill" id="level-fill"></i></span>
    </span>
    <span class="streak" id="streak"></span>
  </header>

  <div class="main">
    <div class="hero">
      <div class="bubble" id="bubble">よーい…</div>
      <svg class="face" id="face" data-mood="idle" viewBox="0 0 220 210" aria-hidden="true">
        <g class="lines">
          <rect x="2" y="76" width="26" height="8" rx="4"/>
          <rect x="10" y="104" width="18" height="8" rx="4"/>
          <rect x="2" y="132" width="26" height="8" rx="4"/>
          <rect x="192" y="76" width="26" height="8" rx="4"/>
          <rect x="192" y="104" width="18" height="8" rx="4"/>
          <rect x="192" y="132" width="26" height="8" rx="4"/>
        </g>
        <g class="tongue-normal">
          <path class="tongue-body" d="M56 202 C40 164 34 80 110 36 C186 80 180 164 164 202 Z"/>
          <path class="tongue-groove" d="M110 74 L110 172"/>
          <ellipse class="tongue-gloss" cx="82" cy="86" rx="15" ry="24"/>
          <g class="eyes eyes-normal">
            <circle cx="88" cy="116" r="11"/>
            <circle cx="132" cy="116" r="11"/>
          </g>
          <g class="eyes eyes-happy">
            <path d="M73 122 q15 -21 30 0"/>
            <path d="M117 122 q15 -21 30 0"/>
          </g>
          <g class="eyes eyes-blank">
            <path d="M76 118 h24"/>
            <path d="M120 118 h24"/>
          </g>
        </g>
        <g class="tongue-knot">
          <path class="knot-outline" d="M110 32 C40 60 40 118 110 118 C180 118 180 190 110 190 C40 190 40 118 110 118 C180 118 180 60 110 32 Z"/>
          <path class="knot-body" d="M110 32 C40 60 40 118 110 118 C180 118 180 190 110 190 C40 190 40 118 110 118 C180 118 180 60 110 32 Z"/>
          <g class="dizzy">
            <path d="M28 44 l14 14 M42 44 l-14 14"/>
            <path d="M178 44 l14 14 M192 44 l-14 14"/>
          </g>
        </g>
        <g class="sweat">
          <path d="M182 50 q9 14 0 20 q-9 -6 0 -20"/>
        </g>
      </svg>
      <div class="combo" id="combo"></div>
    </div>

    <section class="board">
      <h1 class="sentence" id="sentence">-</h1>
      <div class="mora-row" id="mora-row"></div>
      <canvas class="wave" id="wave" width="1600" height="200"></canvas>
    </section>
  </div>

  <div class="stamp" id="stamp" data-show="false">
    <span class="stamp-text" id="stamp-text">正解！</span>
    <span class="stamp-side">
      <b id="stamp-grade">S</b>
      <i id="stamp-time">0.00秒</i>
    </span>
    <span class="stamp-score" id="stamp-score">0</span>
  </div>

  <div class="banner" id="banner"></div>
  <div class="confetti" id="confetti"></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
