<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — 運用log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">

  <div class="app-shell">
    <h1 class="visually-hidden">運用log</h1>
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <div class="x-toolbar">
      <!-- 重要度は「1段だけ」ではなく閾値で選ぶ。障害を追うときに見たいのは「warning以上」で、
           warningだけを出してerrorを隠す選び方は運用上まず使わない。 -->
      <label class="x-field"><span>重要度</span>
        <select id="flt-severity">
          <option value="">すべて（info以上）</option>
          <option value="warning">warning 以上</option>
          <option value="error">error のみ</option>
        </select>
      </label>
      <label class="x-field"><span>種別</span>
        <select id="flt-kind">
          <option value="">すべて</option>
        </select>
      </label>
      <label class="x-field"><span>配信者</span>
        <select id="flt-unique">
          <option value="">すべて</option>
        </select>
      </label>
      <label class="x-field"><span>期間</span>
        <input id="flt-since" type="date" aria-label="この日から" title="この日から" />
      </label>
      <label class="x-field"><span>〜</span>
        <input id="flt-until" type="date" aria-label="この日まで" title="この日まで" />
      </label>
      <label class="x-field"><span>job ID</span>
        <input id="flt-job" type="text" aria-label="job IDで絞込" />
      </label>
      <button id="flt-apply" class="btn btn-primary">絞り込む</button>
      <button id="flt-reset" class="btn">条件をclear</button>
      <span class="sp"></span>
      <span id="ops-summary" class="chart-note"></span>
    </div>

    <div class="a-card a-card-fill">
      <h3>運用log</h3>
      <div class="body">
        <div class="table-wrap">
          <table class="result-table ops-table">
            <thead>
              <tr>
                <th class="act">詳細</th>
                <th>時刻</th><th>重要度</th><th>種別</th><th>対象</th><th class="ops-msg">内容</th>
                <th class="num">処理時間</th>
              </tr>
            </thead>
            <tbody id="ops-rows"></tbody>
          </table>
          <div id="ops-empty" class="feed-empty" data-label="運用log">—</div>
        </div>
        <div class="note-actions">
          <!-- 表は自動で入れ替えない。読んでいる途中の行が勝手に流れると追っている記録を
               見失うので、新着があることだけを出して、押した時に入れ替える。 -->
          <button id="ops-reload" class="btn btn-compact">最新にする</button>
          <button id="ops-more" class="btn btn-compact hidden">さらに読み込む</button>
          <span id="ops-status" class="form-message"></span>
        </div>
      </div>
    </div>

    <div class="a-card">
      <h3>API所要時間</h3>
      <div class="body">
        <div class="note-actions">
          <button id="perf-reload" class="btn btn-compact">最新にする</button>
          <button id="perf-reset" class="btn btn-compact">計測をreset</button>
          <span id="perf-note" class="chart-note"></span>
        </div>
        <div class="table-wrap">
          <table class="result-table">
            <thead>
              <tr>
                <th>API</th>
                <th class="num">回数</th>
                <th class="num">合計</th>
                <th class="num">割合</th>
                <th class="num">平均</th>
                <th class="num">p50</th>
                <th class="num">p95</th>
                <th class="num">最大</th>
                <th>内訳</th>
              </tr>
            </thead>
            <tbody id="perf-rows"></tbody>
          </table>
          <div id="perf-empty" class="feed-empty" data-label="API所要時間">—</div>
        </div>
      </div>
    </div>

  </div>

  <script src="/static/common.js"></script>
  <script src="/static/ops.js"></script>
</body>
</html>
