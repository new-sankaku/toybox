<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok — Battle 詳細</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">
  <div class="scanlines" aria-hidden="true"></div>

  <div class="app-shell">
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav">
        <a href="/">監視</a>
        <a href="/overview">全体監視</a>
        <a href="/history">履歴</a>
        <a href="/streamers">配信者</a>
        <a href="/analytics">全体解析</a>
        <a href="/settings">設定</a>
      </nav>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status">Server接続中…</span></div>
    </div>

    <main class="bwrap">
      <div class="b-head">
        <h2 id="battle-title">Battle 一覧</h2>
        <span class="sum" id="battle-sum"></span>
      </div>
      <div class="bcards" id="battle-cards"></div>
      <div class="a-empty" id="battle-empty"></div>
    </main>

    <div class="a-footer">
      <span id="ws-indicator-foot" class="dot">●</span> <span id="ws-status-foot">Server接続中…</span>
      <span class="right">Glory&nbsp;to&nbsp;Mankind</span>
    </div>
  </div>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/battle.js"></script>
</body>
</html>
