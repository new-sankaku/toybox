<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — Job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">

  <div class="app-shell">
    <h1 class="visually-hidden">Job</h1>
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <div class="x-toolbar">
      <input id="job-flt-text" type="text" aria-label="対象 / job id で絞込" placeholder="🔎 対象 / job id で絞込" autocomplete="off" />
      <label class="x-field"><span>状態</span>
        <select id="job-flt-state">
          <option value="active">実行中・待機中</option>
          <option value="all">全て</option>
          <option value="failed">失敗・中断のみ</option>
        </select>
      </label>
      <!-- 種別の選択肢は /api/jobs の kind_labels から作る。同じ訳語を画面にも置くと
           運用logの語とずれるため、labelの出所はserver(core/ops_labels.py)だけにする。 -->
      <label class="x-field"><span>種別</span>
        <select id="job-flt-kind">
          <option value="all">全て</option>
        </select>
      </label>
      <!-- 絞り込みと同じ範囲に効く一括取消。1本ずつの取り消しは行のbuttonが持つが、
           数百本の一括投入を止める手段がここにしか無い(投入した画面には台帳が無い)。 -->
      <button id="job-cancel-all" class="btn btn-danger btn-small" type="button">まとめて取消</button>
      <span class="sp"></span>
      <span id="job-failed-note" class="chart-note"></span>
      <span id="job-limit-note" class="chart-note"></span>
      <span id="gpu-summary" class="chart-note"></span>
      <span id="stt-summary" class="chart-note"></span>
    </div>

    <div class="a-card a-card-fill" id="jobs">
      <h3>Job</h3>
      <div class="body">
        <div class="table-wrap">
          <table class="result-table" id="job-table">
            <thead>
              <tr>
                <th data-sort="state">状態</th><th data-sort="kind">種別</th>
                <th data-sort="target">対象</th><th data-sort="pct">進捗</th>
                <th data-sort="queued">投入</th><th data-sort="elapsed">所要</th>
                <th data-sort="result">結果</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="job-rows"></tbody>
          </table>
          <div id="job-empty" class="feed-empty" data-label="job一覧">—</div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/jobs.js"></script>
</body>
</html>
