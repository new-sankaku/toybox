<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — 全体解析</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">

  <div class="app-shell">
    <h1 class="visually-hidden">全体解析</h1>
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <main class="an-page">
      <!-- 期間フィルタ + 母集団サマリ -->
      <div class="an-controls">
        <label class="an-ctl">集計期間
          <select id="an-period">
            <option value="0">全期間</option>
            <option value="90">直近90日</option>
            <option value="30">直近30日</option>
            <option value="7">直近7日</option>
          </select>
        </label>
        <button type="button" class="btn btn-small" id="an-reload">再取得</button>
        <span class="an-auto" id="an-auto" aria-live="polite"></span>
        <div class="a-kpibar an-summary" id="an-summary"></div>
        <!-- 17 sectionはDOM順=番号順だが、本文も他sectionを番号で名指しする。
             目次があれば「⑭を見よ」と言われたときに目視scrollで探さずに済む。 -->
        <nav class="an-index" id="an-index" aria-label="section目次"></nav>
      </div>
      <!-- ① 時間帯インデックス -->
      <section class="result-block an-col1" id="an-s1">
        <h3 class="result-subtitle">■ ① <span id="an-ti-title-metric">入室</span>の時間帯</h3>
        <div class="an-ti-ctls">
          <label class="an-ctl">指標
            <select id="an-ti-metric">
              <option value="joins">入室</option>
              <option value="comments">コメント</option>
              <option value="diamonds">コイン</option>
              <option value="likes">Like</option>
              <option value="follows">Follow</option>
            </select>
          </label>
          <label class="an-ctl"><input type="checkbox" id="an-ti-numbers" /> 数値</label>
          <label class="an-ctl"><input type="checkbox" id="an-ti-empty" /> 空行</label>
        </div>
        <div class="an-legendline" id="an-ti-note"></div>
        <div class="an-muted" id="an-ti-emptymsg" hidden>—</div>
        <div class="an-hm-wrap"><div class="an-heatmap" id="an-ti-heatmap"></div></div>
      </section>

      <!-- ①' organic入室(ノイズ除去した時間帯の関心) -->
      <section class="result-block an-col1" id="an-s1d">
        <h3 class="result-subtitle">■ ①' ノイズ除去後の入室</h3>
        <div class="an-organic-pair">
          <div class="an-organic-col">
            <div class="result-subtitle an-subhead" id="an-organic-wd-head">平日（月〜金）</div>
            <div class="x-chartwrap an-chart-short"><canvas id="an-organic-chart-wd"></canvas></div>
          </div>
          <div class="an-organic-col">
            <div class="result-subtitle an-subhead" id="an-organic-he-head">休日（土日）</div>
            <div class="x-chartwrap an-chart-short"><canvas id="an-organic-chart-he"></canvas></div>
          </div>
        </div>
        <div class="an-legendline" id="an-organic-note"></div>
      </section>

      <!-- ② 入室のコンテキスト別 -->
      <section class="result-block an-col1" id="an-s2">
        <h3 class="result-subtitle">■ ② 状況別の入室速度</h3>
        <div class="x-chartwrap an-chart-short"><canvas id="an-context-chart"></canvas></div>
        <div class="an-legendline" id="an-context-note"></div>
      </section>

      <!-- ②' 入室の流入元とフォロー関係(F6: 既に届いているfieldの追加読み) -->
      <section class="result-block" id="an-s2d">
        <h3 class="result-subtitle">■ ②' 流入元とフォロー</h3>
        <div class="an-organic-pair">
          <div class="an-organic-col">
            <div class="result-subtitle an-subhead">流入元（入室）</div>
            <div class="table-wrap"><table class="result-table" id="an-entry-src"></table></div>
          </div>
          <div class="an-organic-col">
            <div class="result-subtitle an-subhead">フォロー関係</div>
            <div class="table-wrap"><table class="result-table" id="an-entry-follow"></table></div>
          </div>
        </div>
        <div class="an-legendline" id="an-entry-note"></div>
      </section>

      <!-- ③ シェア→入室(event-study) -->
      <section class="result-block an-col1" id="an-s3">
        <h3 class="result-subtitle">■ ③ シェアの効果</h3>
        <div class="x-chartwrap an-chart-short"><canvas id="an-share-chart"></canvas></div>
        <div class="an-legendline" id="an-share-note"></div>
      </section>

      <!-- ③' Battle影響(event-study, placebo補正) -->
      <section class="result-block an-col1" id="an-s3d">
        <h3 class="result-subtitle">■ ③' バトル開始の効果</h3>
        <div class="x-chartwrap an-chart-short"><canvas id="an-battle-chart"></canvas></div>
        <div class="an-legendline" id="an-battle-note"></div>
      </section>

      <!-- ⑤ 入室 → 定着 -->
      <section class="result-block an-col1" id="an-s5">
        <h3 class="result-subtitle">■ ⑤ 入室→定着</h3>
        <div class="an-legendline" id="an-retention-note"></div>
        <div class="x-chartstack an-chart-short" id="an-retention-hour"></div>
      </section>

      <!-- ⑥ ギフト / コメント集中度 -->
      <section class="result-block an-col1" id="an-s6">
        <h3 class="result-subtitle">■ ⑥ 集中度</h3>
        <div class="an-grid2">
          <div>
            <div class="an-legendline" id="an-conc-gift-note"></div>
            <div class="x-chartwrap an-chart-short"><canvas id="an-lorenz-gift"></canvas></div>
            <div class="a-kpibar an-conc-top" id="an-conc-gift-top"></div>
          </div>
          <div>
            <div class="an-legendline" id="an-conc-comment-note"></div>
            <div class="x-chartwrap an-chart-short"><canvas id="an-lorenz-comment"></canvas></div>
            <div class="a-kpibar an-conc-top" id="an-conc-comment-top"></div>
          </div>
        </div>
      </section>

      <!-- ⑦ 入室の質(新規/常連) -->
      <section class="result-block an-col1" id="an-s7">
        <h3 class="result-subtitle">■ ⑦ 新規率</h3>
        <div class="x-chartstack an-chart-short" id="an-quality-chart"></div>
        <div class="an-legendline" id="an-quality-note"></div>
      </section>

      <!-- ⑨ グローブ(5倍)のcoin帯別 発動率 -->
      <section class="result-block an-col1" id="an-s9">
        <h3 class="result-subtitle">■ ⑨ グローブ発動率</h3>
        <div class="x-chartwrap an-chart-short"><canvas id="an-glove-chart"></canvas></div>
        <div class="an-legendline" id="an-glove-note"></div>
      </section>

      <!-- ⑪ 収集の取得率(F10 Phase2) -->
      <section class="result-block" id="an-s11">
        <h3 class="result-subtitle">■ ⑪ 取得率</h3>
        <div class="table-wrap"><table class="result-table" id="an-coverage"></table></div>
        <div class="an-legendline" id="an-coverage-note"></div>
      </section>

      <!-- ⑫ 滞在時間と入れ替わり(Little則) -->
      <section class="result-block" id="an-s12">
        <h3 class="result-subtitle">■ ⑫ 滞在時間</h3>
        <div class="a-kpibar an-conc-top" id="an-dwell-kpi"></div>
        <div class="x-chartwrap an-chart-short"><canvas id="an-dwell-hour"></canvas></div>
        <div class="table-wrap"><table class="result-table" id="an-dwell-streamers"></table></div>
        <div class="an-legendline" id="an-dwell-note"></div>
      </section>

      <!-- ⑭ 入室後の初回反応(activation funnel) -->
      <section class="result-block" id="an-s14">
        <h3 class="result-subtitle">■ ⑭ 初回反応</h3>
        <div class="a-kpibar an-conc-top" id="an-act-kpi"></div>
        <div class="x-chartwrap an-chart-short"><canvas id="an-act-chart"></canvas></div>
        <div class="table-wrap"><table class="result-table" id="an-act-table"></table></div>
        <div class="an-legendline" id="an-act-note"></div>
      </section>

    </main>

    <div class="a-footer">
      <span id="ws-indicator-foot" class="dot">●</span> <span id="ws-status-foot" aria-live="polite">Server接続中…</span>
      <span class="right">Glory&nbsp;to&nbsp;Mankind</span>
    </div>
  </div>

  <script src="/static/vendor/chart.umd.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/analytics.js"></script>
</body>
</html>
