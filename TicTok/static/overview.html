<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — 全体監視</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">
  <div class="scanlines" aria-hidden="true"></div>

  <div class="app-shell">
    <h1 class="visually-hidden">全体監視</h1>
    <!-- 行1: スリムトップバー -->
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <!-- 行2: 集計バー + ツールバー -->
    <div class="a-summary">
      <div class="a-chip"><span class="l">監視数</span><span class="v" id="sum-monitors">0</span></div>
      <div class="a-chip"><span class="l">LIVE中</span><span class="v ok" id="sum-live">0</span></div>
      <div class="a-chip"><span class="l">録画中</span><span class="v" id="sum-recording">0</span></div>
      <div class="a-chip" title="LIVE中の配信の現在の視聴者を合計した数です。切断中の配信は含みません。"><span class="l">LIVE視聴者</span><span class="v" id="sum-viewers">0</span></div>
      <div class="a-chip"><span class="l">合計Gift</span><span class="v" id="sum-gifts">0</span></div>
      <div class="a-chip"><span class="l">合計コイン</span><span class="v" id="sum-diamonds">0</span></div>
      <div class="a-toolbar">
        並替
        <select id="sort-select">
          <option value="diamonds">コイン降順</option>
          <option value="viewers">視聴者降順</option>
          <option value="rate_gifts">Gift/分</option>
          <option value="rate_diamonds">コイン/分</option>
          <option value="status">状態</option>
        </select>
        <button id="video-all-on">映像 全ON</button>
        <button id="audio-all-off">音声 全OFF</button>
      </div>
    </div>

    <!-- 行3: 高密度タイル -->
    <div id="monitor-grid" class="a-tiles"></div>
    <div id="grid-empty" class="a-empty">監視対象がありません。</div>

    <!-- 行4: フッター -->
    <div class="a-footer">
      <span id="ws-indicator-foot" class="dot">●</span> <span id="ws-status-foot" aria-live="polite">Server接続中…</span>
      <span class="right">Glory&nbsp;to&nbsp;Mankind</span>
    </div>
  </div>

  <script src="/static/vendor/hls.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/overview.js"></script>
</body>
</html>
