<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — 設定</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">

  <div class="app-shell">
    <h1 class="visually-hidden">設定</h1>
    <!-- 行1: スリムトップバー（他tabと統一） -->
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <!-- 行2: スクロール可能な設定本体 -->
    <div class="a-content">
      <div class="a-card a-settingscard">
        <h3>設定</h3>
        <div class="body">
          <div class="settings-filter">
            <input id="settings-filter" type="search" aria-label="絞込" placeholder="項目名・説明・keyで絞り込む" />
            <span id="settings-filter-count" class="chart-note"></span>
          </div>
          <div id="settings-form" class="settings-form"></div>
          <!-- 焼き込み設定の調整は「変更→保存→プレビュー→変更」の反復で、保存が表の
               直下にあると1周ごとに上下scrollが要る。card下端に貼り付けて往復を消す。 -->
          <div class="note-actions settings-save-bar">
            <button id="settings-save" class="btn btn-primary">保存</button>
            <span id="settings-status" class="form-message" aria-live="polite"></span>
          </div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>通知の宛先</h3>
        <div class="body">
          <div class="note-actions">
            <button id="notify-test" class="btn btn-primary">テスト通知を送る</button>
            <span id="notify-status" class="form-message"></span>
          </div>
          <div id="notify-summary" class="chart-note"></div>
          <div class="table-wrap">
            <table class="result-table">
              <thead><tr><th>宛先</th><th>形式</th><th>結果</th></tr></thead>
              <tbody id="notify-target-list"></tbody>
            </table>
          </div>
          <div id="notify-target-empty" class="chart-note hidden">宛先なし</div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>焼き込みプレビュー</h3>
        <div class="body">
          <div class="note-actions">
            <select id="preview-recording"></select>
            <button id="preview-still-btn" class="btn btn-primary">静止画で確認</button>
            <button id="preview-clip-btn" class="btn">動画で確認</button>
            <span id="preview-status" class="form-message"></span>
          </div>
          <div id="preview-meta" class="chart-note"></div>
          <div id="preview-output" class="preview-output"></div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>shortの型</h3>
        <div class="body">
          <!-- 型が設定表ではなく別の表なのは、同時に複数成立する値だからである。設定は
               1 keyに1値しか持てず、短尺の型と中尺の型を併存させた時点で表現できない。 -->
          <div class="note-actions">
            <input id="short-preset-name" type="text" placeholder="型の名前（例: 短尺 15〜60秒）" aria-label="型の名前" />
            <button id="short-preset-add" class="btn btn-primary">型を追加</button>
            <span id="short-preset-status" class="form-message" aria-live="polite"></span>
          </div>
          <div id="short-preset-list" class="settings-form"></div>
          <div id="short-preset-empty" class="feed-empty" data-label="shortの型">型なし</div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>保持policy <span class="sub">古いdataの削除</span></h3>
        <div class="body">
          <div class="note-actions">
            <button id="retention-preview" class="btn">確認</button>
            <button id="retention-apply" class="btn btn-danger" disabled>削除</button>
            <span id="retention-status" class="form-message"></span>
          </div>
          <div id="retention-plan"></div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>Databaseの保守</h3>
        <div class="body">
          <div class="note-actions">
            <button id="mnt-backup" class="btn btn-primary">今すぐ退避</button>
            <button id="mnt-integrity" class="btn">健全性check</button>
            <button id="mnt-checkpoint" class="btn">WAL checkpoint</button>
            <button id="mnt-vacuum" class="btn btn-danger">VACUUM</button>
            <button id="mnt-unfreeze" class="btn" hidden>刈り取りの凍結を解除</button>
            <span id="mnt-status" class="form-message"></span>
          </div>
          <div id="mnt-summary" class="chart-note"></div>
          <div id="mnt-guard" class="chart-note" hidden></div>
          <div class="table-wrap">
            <table class="result-table">
              <thead>
                <tr><th>退避file</th><th>種別</th><th>取得日時</th><th>層</th><th>size</th></tr>
              </thead>
              <tbody id="mnt-rows"></tbody>
            </table>
            <div id="mnt-empty" class="feed-empty" data-label="退避">退避fileなし</div>
          </div>
        </div>
      </div>

    </div>

    <!-- 行3: フッター -->
    <div class="a-footer">
      <span id="ws-indicator-foot" class="dot">●</span>
      <span class="right">Glory&nbsp;to&nbsp;Mankind</span>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
