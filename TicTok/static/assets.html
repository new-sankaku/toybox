<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — 素材</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">
  <div class="app-shell">
    <h1 class="visually-hidden">素材</h1>
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <div class="x-toolbar">
      <input id="as-q" type="text" aria-label="絞込" placeholder="🔎 名前 / ID で絞込" autocomplete="off" />
      <!-- 配信者の絞込を受けるかどうかも種別ごとに違い、それを名乗るのはserver(summaryの
           filters)。受けない種別へ渡すとserverは400を返すので、受けない種別ではcontrolごと
           伏せて渡さない。選択肢はsummaryのstreamersから作る。 -->
      <label class="x-field hidden" id="as-streamer-field"><span>配信者</span>
        <select id="as-streamer"></select>
      </label>
      <!-- 選べる並び順は種別ごとに違い、その一覧はserverが持つ(summaryのsorts)。
           画面が対応表を持つと、種別が増えた時に黙って古いままになる。 -->
      <label class="x-field hidden" id="as-sort-field"><span>並替</span>
        <select id="as-sort"></select>
      </label>
      <label class="x-field hidden" id="as-order-field"><span>向き</span>
        <select id="as-order">
          <option value="desc">降順</option>
          <option value="asc">昇順</option>
        </select>
      </label>
      <label class="x-field"><span>表示</span>
        <select id="as-limit">
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500">500</option>
        </select>
      </label>
      <button id="as-select-all" class="btn btn-small" type="button">全選択</button>
      <button id="as-clear" class="btn btn-small" type="button">解除</button>
      <button id="as-zip-selected" class="btn btn-small" type="button">選択をZIP</button>
      <!-- 検索での絞込は載らない(発券は種別とidしか受けない)。押した後に出る確認へ、
           serverが数えた件数と容量、絞込が効かないことを名乗る。 -->
      <button id="as-zip-all" class="btn btn-small" type="button">全件ZIP</button>
      <!-- 件数・容量はDBのsnapshotで、この画面を開いても数え直さない。数え直すのはこの
           button だけ(容量内訳の「容量を再scanする」と同じ扱い)。 -->
      <button id="as-rescan" class="btn btn-small" type="button">再集計</button>
      <span id="as-busy" class="form-message" aria-live="polite"></span>
      <span class="sp"></span>
      <span id="as-summary" class="chart-note"></span>
    </div>

    <div class="as-split">
      <aside class="as-kinds" id="as-kinds" aria-label="素材の種別"></aside>

      <div class="a-card a-card-fill as-main">
        <h3><span id="as-title">素材</span></h3>
        <div class="body">
          <!-- 語なしで開いた大きな種別の案内。一覧の上に出す — 下へ置くと、先頭100枚を
               scrollし切った人にしか届かない。文言が入るまで行を作らない(:empty)。 -->
          <div id="as-note" class="as-note"></div>
          <div class="as-grid" id="as-grid"></div>
          <div id="as-empty" class="feed-empty" data-label="素材一覧">素材なし</div>
          <div class="as-more">
            <button id="as-more" class="btn btn-small hidden" type="button">続き</button>
            <span id="as-more-note" class="chart-note"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ZIPの受け取り先。券のGETをこの中で起こす — 画面ごと飛ばすと、券が切れていたときに
       404のJSONへ着地する。fetchしてblobにすると全件538MBをmemoryへ抱える。 -->
  <iframe id="as-dl-frame" class="hidden" title="ZIPの受け取り" aria-hidden="true"></iframe>

  <script src="/static/common.js"></script>
  <script src="/static/assets.js"></script>
</body>
</html>
