<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TicTok LIVE Monitor — 動画容量</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="app-dashboard">

  <div class="app-shell">
    <h1 class="visually-hidden">動画容量</h1>
    <div class="a-topbar">
      <div class="a-brand"><span class="m">■</span> <b>TicTok</b></div>
      <nav class="a-nav"></nav>
      <div class="a-disk" id="disk-bar" title="録画・出力先の空き容量"></div>
      <div class="a-ws"><span id="ws-indicator" class="dot">●</span> <span id="ws-status" aria-live="polite">Server接続中…</span></div>
    </div>

    <div class="a-content">
      <!-- 1枚目: 操作。この画面へ来る動機の大半が「一時保存先が埋まったので動画を移す」
           なので、見通しや内訳より先に置く。 -->
      <div class="a-card a-settingscard" id="places">
        <h3>動画の保存先</h3>
        <div class="body">
          <div id="cap-flow" class="cap-flow">
            <div class="cap-place" id="cap-place-work">
              <span class="l">一時保存先</span>
              <code class="p" id="cap-work-path">-</code>
              <span class="v" id="cap-work-total">-</span>
            </div>

            <div class="cap-move" id="cap-move">
              <span class="cap-arrow" aria-hidden="true">▼</span>
              <span class="cap-move-text" id="cap-move-text">-</span>
              <div class="note-actions">
                <button id="reloc-plan" class="btn">対象を確認</button>
                <button id="reloc-apply" class="btn btn-primary hidden">最終保存先へ移動</button>
                <span id="reloc-status" class="form-message"></span>
              </div>
            </div>

            <div class="cap-place" id="cap-place-final">
              <span class="l">最終保存先</span>
              <code class="p" id="cap-final-path">-</code>
              <span class="v" id="cap-final-total">-</span>
              <code class="p" id="cap-final-path2" hidden>-</code>
            </div>
          </div>

          <div id="cap-place-note" class="chart-note"></div>

          <!-- 最終保存先が2つあるときだけ出す。2つは振り分け先ではなく相互の控えなので、
               揃っているかどうかを人が確かめられる口をここに置く。 -->
          <div id="mirror-box" class="chart-note" hidden>
            <div id="mirror-summary"></div>
            <div class="note-actions">
              <button id="mirror-plan" class="btn">揃っているか確認</button>
              <button id="mirror-apply" class="btn btn-primary hidden">欠けている分を複製</button>
              <span id="mirror-status" class="form-message"></span>
            </div>
            <div id="mirror-detail" class="hidden">
              <div class="table-wrap">
                <table class="result-table">
                  <thead><tr><th>場所</th><th>複製先</th><th class="num">本数</th><th class="num">容量</th></tr></thead>
                  <tbody id="mirror-rows"></tbody>
                </table>
                <div id="mirror-empty" class="feed-empty" data-label="欠けているfile">—</div>
              </div>
            </div>
          </div>

          <!-- 対象一覧は「対象を確認」を押すまで出さない。押した順序(確認→実行)を保つ。 -->
          <div id="reloc-detail" class="hidden">
            <div id="reloc-summary" class="chart-note"></div>
            <div class="table-wrap">
              <table class="result-table">
                <thead><tr><th>配信者</th><th class="num">本数</th><th class="num">容量</th></tr></thead>
                <tbody id="reloc-rows"></tbody>
              </table>
              <div id="reloc-empty" class="feed-empty" data-label="移動対象">—</div>
            </div>
          </div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>driveの空きと満杯まで</h3>
        <div class="body">
          <div class="note-actions">
            <button id="cap-reload" class="btn">最新にする</button>
            <button id="cap-sample" class="btn">容量を今すぐ記録</button>
            <span id="cap-status" class="form-message"></span>
          </div>
          <div class="table-wrap">
            <table class="result-table">
              <thead>
                <tr><th>Drive</th><th class="num">空き</th><th class="num">全体</th><th class="num">1日あたり</th><th class="num">満杯まで</th></tr>
              </thead>
              <tbody id="cap-rows"></tbody>
            </table>
            <div id="cap-empty" class="feed-empty" data-label="容量">—</div>
          </div>
          <div id="cap-summary" class="chart-note"></div>
        </div>
      </div>

      <div class="a-card a-settingscard">
        <h3>使用量の推移</h3>
        <div class="body">
          <div class="cap-grid">
            <section class="cap-cell">
              <h4 class="result-subtitle sm-subtitle">録画の増加実績</h4>
              <div class="table-wrap">
                <table class="result-table">
                  <thead><tr><th>日</th><th class="num">録画</th><th class="num">増加</th></tr></thead>
                  <tbody id="cap-daily"></tbody>
                </table>
                <div id="cap-daily-empty" class="feed-empty" data-label="録画の増加実績">—</div>
              </div>
            </section>

            <section class="cap-cell">
              <h4 class="result-subtitle sm-subtitle">後処理の完了率</h4>
              <div class="a-kpibar cap-kpibar" id="cap-completion"></div>
            </section>

            <section class="cap-cell">
              <h4 class="result-subtitle sm-subtitle">Databaseの使用量</h4>
              <div class="a-kpibar cap-kpibar" id="cap-dbusage"></div>
              <div id="cap-dbrows" class="chart-note"></div>
            </section>
          </div>
        </div>
      </div>

      <!-- 設定画面から移設。drive全体の空き(上)に対して、こちらは録画folderの中身の内訳。 -->
      <div class="a-card a-settingscard">
        <h3>録画folderの内訳</h3>
        <div class="body">
          <div class="note-actions">
            <button id="usage-scan" class="btn btn-primary">再scan</button>
            <span id="usage-status" class="form-message"></span>
          </div>
          <div id="usage-summary" class="chart-note"></div>
          <!-- 表の前に盤を置く。表は「どれが何GBか」を答えるが、「何が食っていて、どれを
               消してよいか」は数字を読み比べないと出て来ない。盤はその2つを面積と形で先に
               答え、表はその裏付けとして下に残す。 -->
          <div class="cap-board" id="usage-board" hidden>
            <div class="cap-board-cells" id="usage-board-cells"></div>
            <div class="cap-board-legend" id="usage-board-legend"></div>
          </div>
          <div class="table-wrap">
            <table class="result-table">
              <thead><tr><th>種別</th><th class="num">容量</th><th class="num">file数</th><th>作り直せるか</th></tr></thead>
              <tbody id="usage-category-list"></tbody>
            </table>
          </div>
          <div id="usage-category-empty" class="chart-note hidden" data-label="種別別の内訳">—</div>
          <div class="table-wrap">
            <table class="result-table">
              <!-- 列はserverの種別定義(category_labels)から組む。画面が列を持つと、種別が
                   増えたときに「容量」列と内訳の和が黙って合わなくなる。 -->
              <thead><tr id="usage-streamer-head"></tr></thead>
              <tbody id="usage-streamer-list"></tbody>
            </table>
          </div>
          <div id="usage-streamer-empty" class="chart-note hidden" data-label="配信者別の内訳">—</div>
        </div>
      </div>
    </div>

    <div class="a-footer">
      <span id="ws-indicator-foot" class="dot">●</span> <span id="ws-status-foot">Server接続中…</span>
      <span class="right">Glory&nbsp;to&nbsp;Mankind</span>
    </div>
  </div>

  <script src="/static/common.js"></script>
  <script src="/static/capacity.js"></script>
</body>
</html>
