[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    slow: takes noticeable wall time; deselect with -m "not slow"
    requires_ffmpeg: needs a real ffmpeg/ffprobe binary on PATH
    requires_torch: needs torch/spandrel/whisper and a GPU-capable stack
filterwarnings =
    default
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
