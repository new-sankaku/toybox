name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一branchへ連続pushした場合は古い実行を打ち切る。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # mypyは sys.platform の分岐を評価するため、片方のOSだけでは
        # 他方でしか通らないcodeが未検査になる。両方で回す。
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      # ruffはOS非依存だが、job分割を増やさず同じmatrixで回す。
      - name: ruff
        run: python -m ruff check --output-format=github .

      - name: mypy
        run: python -m mypy

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # requires_ffmpeg markerが付いていないがffmpeg/ffprobeを実際に起動するtestが
      # 存在するため、markerでのdeselectだけでは不足する。runnerへ実体をinstallする。
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Verify ffmpeg is on PATH
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt

      # requires_torch: GPU(CUDA)とtorch/spandrelが要るためrunnerでは実行しない。
      # torch等は requirements.txt でopt-in扱い(未install)なので収集時点で除外する。
      - name: pytest
        run: python -m pytest -q -m "not requires_torch"
