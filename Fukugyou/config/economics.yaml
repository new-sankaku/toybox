# 逆算に使う前提値。tools/economics.py が読みます。
#
#   python tools/economics.py --goal 50000 --price 15000 --config config/economics.yaml
#
# ここに書いた値は「閾値」ではなく「前提」です。実測が取れたら書き換えてください
# （doc/MARKET_RESEARCH.md §4「以後変更禁止」の対象は判定の閾値であって、前提値ではありません）。
# 書き換えたら log/assumptions.md に、前と後の値と根拠を残すこと。

# ---- 出所のある値 --------------------------------------------------------
margin: 0.70
# 利益率。Acquire.com 2024、利益の出ている SaaS の平均71%。
# 標本が「利益の出ている事業」に限られるので、これから始める事業には楽観側。

churn_monthly: 0.05
# 月あたりの解約率。ChartMogul 2023、ARR $300k 未満の帯の年次継続率の中央値 54.8% を月次換算（4.9%）。
# 日本の個人規模の値ではありません。
# なお同じ資料に価格帯別の値があり、月$50未満で12.25%/月、月$250超で2.97%/月。
# 安い値段を狙うなら 0.1225 に上げて計算してください（doc/MARKET_RESEARCH.md §6.4）。

# ---- 自分で決める値 ------------------------------------------------------
horizon_months: 18
# 何か月で目標に到達したいか。長くすると必要な月あたりの獲得数が減ります。

budget_hours_month: 30.33
# 月に使える時間。週7時間 × 4.333。

# ---- 未実測。仮置き。ここを実測に置き換えるのが調査の目的です ------------
flow_conversion: 0.005
# 見知らぬ相手に声をかけたときの成約率。段階5 の実測で置き換える。
# 実名の知人・紹介なら1桁上がります（仮に10%）。

flow_hours_contact: 0.25
# 1人に声をかけるのにかかる時間（連絡・日程調整・記録を含む）。

stock_free_to_paid: 0.01
# 無料で使った人のうち有料に移る割合。**この値が結論を最も強く動かします。**
# 出所を発見できていません。0.005〜0.03 で振って確かめてください。

stock_hours_month: 4.0
# 掲載1本の維持にかかる月あたりの時間。

stock_hours_build: 40.0
# 掲載1本を作るのにかかる時間。

support_hours_contract: 0.25
# 契約1件あたり、月に発生する問い合わせ対応の時間。
# 一次情報に原典が見つかっていません（doc/MARKET_RESEARCH.md §9）。
# 契約数が多い（＝安い値段の）企画ほど、ここが効きます。
