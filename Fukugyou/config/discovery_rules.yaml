# 粗い取捨選択（段階B）の規則。tools/discovery/screen.py が読みます。
#
# AUTOMATION.md §2 制約3「閾値を道具の中に埋めない」に従い、ここに置いています。
# 変更したら git の履歴に残してください。走りながら緩めることを防ぐためです。
#
# 各規則は「該当した事実」を出すだけです。採否は人が決めます（制約8）。

meta:
  version: 1
  created: 2026-08-18
  basis: |
    2026-08-18 に実際に誤判定した4件から規則を起こしました。
      - note.com/mokuyokai/n/nf5ed325f66fc  有料communityの会員取材記事を一人称の体験談と誤認
      - zenn.dev/hacobu/...                 企業のAI hackathon 題材を困りごと駆動と誤認
      - qiita.com/matsu_yoshi59/...         社内のレジ袋請求という別作業を同一clusterに混入
      - 全般                                 snippet を全文と誤認して引用した

# 本文が取れているかの確認。取得失敗を「内容が薄い」と誤読しないための最初の関門。
body:
  min_chars: 1200
  # 1200 未満は本文取得に失敗している可能性が高い。実測: 上記4件のうち
  # note.com の2件は 2273 / 3712 字で、うち記事本文は半分以下でした。
  nav_ratio_max: 0.5
  # 取得文字数に対する定型 navigation 語の比率。これを超えたら本文が入っていない疑い。

# 一人称の体験談か、第三者の取材・紹介記事か
first_person:
  markers: ["私は", "私が", "私の", "僕は", "自分が", "弊社", "当社では", "うちの会社"]
  min_hits: 1
  # 0 件なら一人称でない疑い。取材記事・広告記事はここで落ちます。

third_party_report:
  # 第三者を取材した記事の signal。困りごとの当事者は書き手ではありません。
  markers: ["さんのインタビュー", "さんに聞", "取材", "さんの事例", "さんが伝えたかった"]
  min_hits: 1

# 宣伝・集客目的の記事
promotion:
  # 価格表記と勧誘語が同時に出たら宣伝の疑い。片方だけでは落としません。
  price_patterns: ['月額\s*[0-9,]+\s*円', '[0-9,]+\s*円\s*/\s*月', '年間\s*[0-9,]+\s*円']
  solicit_markers: ["入会", "お申し込み", "受講", "無料相談", "お問い合わせください",
                    "メンバー募集", "参加者募集", "コミュニティです", "見放題"]
  require_both: true

# 作りたくて作ったのか、困って作ったのか
build_motive:
  # 「題材として選んだ」ことを示す語。困りごと駆動の証拠を弱めます。
  weak_motive_markers: ["hackathon", "ハッカソン", "ネタ", "作ってみたい", "作りたい",
                        "勉強のため", "練習として", "試しに"]

# 困りごとの大きさが数字で書かれているか
quantified_pain:
  # 実測値が無い困りごとは、痛みの大きさを判定できません。
  patterns: ['[0-9]+\s*時間', '[0-9]+\s*分', '[0-9]+\s*件', '[0-9]+\s*通', '[0-9]+\s*名',
             '毎月', '月初', '毎日', '毎週', '[0-9]+\s*か月', '[0-9]+\s*ヶ月']
  min_distinct: 2
  # 2種類以上の数量表現が要る。「毎月つらい」だけでは大きさが分かりません。

# 既に金または時間を投じているか（MARKET_RESEARCH.md 段階1 の完了条件）
investment:
  markers: ["自作", "作りました", "作った", "開発しました", "自動化しました",
            "Excel で管理", "スプレッドシートで管理", "手入力", "手作業",
            "解約", "乗り換え", "契約している", "使っています"]
  min_hits: 1

# 出力の並べ替えにのみ使う。閾値ではありません。
report:
  flags_order: ["body_too_short", "nav_heavy", "no_first_person", "third_party_report",
                "promotion", "weak_motive", "no_quantified_pain", "no_investment"]
