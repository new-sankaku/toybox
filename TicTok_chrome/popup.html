<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>TicTok Live Comment Poster</title>
    <style>
      :root {
        color-scheme: light dark;
        --ink: #101014;
        --ink-muted: #5a5a66;
        --surface: #ffffff;
        --surface-panel: #f3f3f6;
        --line: #d4d4dc;
        --accent: #d02f4b;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ink: #ececf1;
          --ink-muted: #a0a0ad;
          --surface: #17171c;
          --surface-panel: #21212a;
          --line: #35353f;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0.9em;
        min-width: 24em;
        display: flex;
        flex-direction: column;
        gap: 0.7em;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: var(--ink);
        background: var(--surface);
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 0.3em;
        color: var(--ink-muted);
      }

      textarea,
      input {
        width: 100%;
        padding: 0.45em 0.55em;
        font: inherit;
        color: var(--ink);
        background: var(--surface-panel);
        border: 1px solid var(--line);
        border-radius: 4px;
      }

      textarea {
        min-height: 6em;
        resize: vertical;
      }

      .row {
        display: flex;
        gap: 0.7em;
      }

      .row > label {
        flex: 1 1 0;
        min-width: 0;
      }

      .actions {
        display: flex;
        gap: 0.5em;
      }

      button {
        flex: 1 1 0;
        padding: 0.55em 0.6em;
        font: inherit;
        font-weight: 600;
        color: var(--ink);
        background: var(--surface-panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
      }

      button.primary {
        color: #fff;
        background: var(--accent);
        border-color: var(--accent);
      }

      button:disabled {
        opacity: 0.5;
        cursor: default;
      }

      #status {
        padding: 0.55em 0.65em;
        background: var(--surface-panel);
        border: 1px solid var(--line);
        border-radius: 4px;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--ink-muted);
      }

      #status.error {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <label>
      投稿する文面（1行=1件、上から順に循環）
      <textarea id="messages" spellcheck="false"></textarea>
    </label>

    <div class="row">
      <label>
        間隔（秒）
        <input id="interval" type="number" min="1" step="1" />
      </label>
      <label>
        継続（分）
        <input id="duration" type="number" min="1" step="1" />
      </label>
    </div>

    <div class="actions">
      <button id="start" class="primary" type="button">開始</button>
      <button id="stop" type="button">停止</button>
      <button id="probe" type="button">DOM確認</button>
    </div>

    <div id="status">待機中</div>

    <script src="popup.js"></script>
  </body>
</html>
